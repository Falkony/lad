name: Checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
        env:
          LAD_DATA_DIR: /tmp/lad-ci/db
          LAD_BACKUP_DIR: /tmp/lad-ci/backups
