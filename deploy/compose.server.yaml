name: lad-server
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      LAD_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-lad.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d lad']
      interval: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped
  backup-permissions:
    image: alpine:3
    command: [sh, -eu, -c, 'chown 1000:1000 /backups && chmod 700 /backups']
    volumes: [backups:/backups]
    network_mode: none
    restart: 'no'
  app:
    build: ..
    environment:
      LAD_AUTH_ENABLED: '1'
      LAD_PUBLIC_ORIGIN: https://${LAD_HOSTNAME:?Set LAD_HOSTNAME}
      LAD_OWNER_LOGIN: ${LAD_OWNER_LOGIN:?Set LAD_OWNER_LOGIN}
      LAD_OWNER_PASSWORD_HASH: ${LAD_OWNER_PASSWORD_HASH:?Set LAD_OWNER_PASSWORD_HASH}
      DATABASE_URL: postgres://lad:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/lad
      LAD_BACKUP_DIR: /backups
      LAD_BACKUP_EVERY: ${LAD_BACKUP_EVERY:-10}
      LAD_BACKUP_KEEP: ${LAD_BACKUP_KEEP:-30}
    depends_on:
      db: { condition: service_healthy }
      backup-permissions: { condition: service_completed_successfully }
    volumes: [backups:/backups]
    expose: ['3000']
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, scripts/health.mjs]
      interval: 15s
      timeout: 7s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy: { replicas: 1 }
  proxy:
    image: caddy:2-alpine
    environment:
      LAD_HOSTNAME: ${LAD_HOSTNAME:?Set LAD_HOSTNAME}
    ports: ['80:80', '443:443']
    depends_on:
      app: { condition: service_healthy }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    networks: [public, internal]
    restart: unless-stopped
networks:
  internal: { internal: true }
  public: {}
volumes:
  database: {}
  backups: {}
  certificates: {}
  proxy-config: {}
