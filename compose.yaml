services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lad
      POSTGRES_USER: lad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lad-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lad -d lad']
      interval: 5s
      retries: 5
volumes:
  lad-postgres:
